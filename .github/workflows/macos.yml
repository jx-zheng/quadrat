name: macos

on:
  pull_request:
    paths:
      - "App/**"
      - "Packages/**"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/macos.yml"
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Packages/**"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/macos.yml"

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build, snapshot, perf, leaks
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build Release
        run: |
          xcodebuild \
            -project Quadrat.xcodeproj \
            -scheme Quadrat \
            -configuration Release \
            -derivedDataPath /tmp/quadrat-dd \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=YES \
            build

      - name: Locate app
        id: app
        run: |
          APP="/tmp/quadrat-dd/Build/Products/Release/Quadrat.app"
          test -d "$APP"
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "bin=$APP/Contents/MacOS/Quadrat" >> "$GITHUB_OUTPUT"

      - name: Snapshot screens
        run: |
          mkdir -p /tmp/quadrat-snapshots
          "${{ steps.app.outputs.bin }}" --snapshot /tmp/quadrat-snapshots
          find /tmp/quadrat-snapshots -name 'screen-*.png' | sort

      - name: Synthesize on-disk tree
        run: python3 scripts/synthesize_tree.py /tmp/quadrat-synth 1500000

      - name: Perf
        run: |
          mkdir -p /tmp/quadrat-perf
          "${{ steps.app.outputs.bin }}" \
            --perf /tmp/quadrat-synth \
            --out /tmp/quadrat-perf/perf.json \
            --idle-seconds 30
          python3 -m json.tool /tmp/quadrat-perf/perf.json >/dev/null
          python3 -c 'import json; report=json.load(open("/tmp/quadrat-perf/perf.json")); peak=report["rootScan"]["peakRSSBytes"]; resident=report["rootScan"]["peakResidentBytes"]; rate=report["directoryScan"]["itemsPerSecond"]; print(f"root footprint {peak} resident {resident}; directory items/s {rate:.0f}"); assert peak < 100*1024*1024, "root footprint is over 100 MB"; assert resident < 170*1024*1024, "root resident size regressed"; assert rate >= 250000, "directory scan is slower than 250k items/s"'
          rm -rf /tmp/quadrat-synth

      - name: Leaks
        run: |
          APP="${{ steps.app.outputs.path }}"
          codesign --force --deep --sign - --entitlements scripts/ci-get-task-allow.entitlements "$APP"
          mkdir -p /tmp/quadrat-leaks-dir /tmp/quadrat-leaks
          python3 scripts/synthesize_tree.py /tmp/quadrat-leaks-dir 3000
          set +e
          leaks --atExit -- "${{ steps.app.outputs.bin }}" \
            --perf /tmp/quadrat-leaks-dir \
            --out /tmp/quadrat-leaks/perf.json \
            --skip-root \
            --skip-synthetic \
            --idle-seconds 0 > /tmp/quadrat-leaks/leaks.txt
          status=$?
          set -e
          tail -n 40 /tmp/quadrat-leaks/leaks.txt
          if grep -E "leaks for" /tmp/quadrat-leaks/leaks.txt | grep -v "0 leaks for"; then
            echo "leaks reported allocations" >&2
            exit 1
          fi
          if ! grep -q "0 leaks for" /tmp/quadrat-leaks/leaks.txt; then
            echo "leaks did not report a clean result (exit $status)" >&2
            exit 1
          fi

      - name: Demo video
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p /tmp/quadrat-demo
          BIN="${{ steps.app.outputs.bin }}"
          MOV=/tmp/quadrat-demo/capture.mov
          OUT=/tmp/quadrat-demo/quadrat-demo.mp4
          screencapture -v "$MOV" &
          CAP=$!
          sleep 1
          "$BIN" --demo
          sleep 1
          kill -INT "$CAP" || true
          wait "$CAP" || true
          test -s "$MOV"
          if ! command -v ffmpeg >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -y -i "$MOV" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$OUT"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$OUT"
          python3 - <<'PY'
          import json, subprocess
          raw = subprocess.check_output([
              "ffprobe", "-v", "error", "-select_streams", "v:0",
              "-show_entries", "stream=width,height,codec_name:format=duration",
              "-of", "json", "/tmp/quadrat-demo/quadrat-demo.mp4",
          ])
          info = json.loads(raw)
          stream = info["streams"][0]
          width, height = int(stream["width"]), int(stream["height"])
          duration = float(info["format"]["duration"])
          print(f"demo {width}x{height} {stream['codec_name']} {duration:.1f}s")
          assert stream["codec_name"] == "h264"
          assert width >= 1280 and height >= 800
          assert 60 <= duration <= 130
          PY

      - name: Upload snapshots and perf
        uses: actions/upload-artifact@v4
        with:
          name: quadrat-results
          path: |
            /tmp/quadrat-snapshots/
            /tmp/quadrat-perf/perf.json
            /tmp/quadrat-leaks/leaks.txt
          if-no-files-found: error

      - name: Upload demo
        uses: actions/upload-artifact@v4
        with:
          name: quadrat-demo
          path: /tmp/quadrat-demo/quadrat-demo.mp4
          if-no-files-found: error
