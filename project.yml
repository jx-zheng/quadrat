name: Quadrat
options:
  bundleIdPrefix: com.kevinzheng
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  SWIFT_VERSION: "5.0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: "-"
  ENABLE_HARDENED_RUNTIME: YES
  SWIFT_STRICT_CONCURRENCY: minimal
packages:
  QuadratCore:
    path: Packages/QuadratCore
targets:
  Quadrat:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Quadrat.entitlements
    dependencies:
      - package: QuadratCore
        product: QuadratCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinzheng.quadrat
        PRODUCT_NAME: Quadrat
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Quadrat.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
    postBuildScripts:
      - name: Embed Git SHA
        basedOnDependencyAnalysis: false
        script: |
          SHA=$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null || true)
          if [ -z "$SHA" ]; then SHA=dev; fi
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :GitCommit ${SHA}" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :GitCommit string ${SHA}" "$PLIST"
          fi

